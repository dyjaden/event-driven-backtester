[project]
name = "backtester"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.5",
    "pyarrow>=25.0",
    "matplotlib>=3.11",
    "yfinance>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]